name: Build unsigned iOS IPA

# 手动触发；也可以在推送 tag 时触发
on:
  workflow_dispatch:
    inputs:
      build_name:
        description: '产物文件名（不含 .ipa）'
        required: false
        default: 'XJTUYou-unsigned'
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    # macos-26 = Apple Silicon + Xcode 26。
    # 必须用 26：flutter_zxing 拖进来的 camera_avfoundation 0.10.3+1
    # 用了 AVCaptureSession.wasInterruptedNotification / runtimeErrorNotification，
    # 这两个是 iOS 26 SDK 的 API，macos-14/15 上的旧 SDK 编译不过。
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Flutter version & doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Pod install
        working-directory: ios
        run: |
          pod install --repo-update
        continue-on-error: true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into .ipa
        run: |
          set -e
          NAME="${{ github.event.inputs.build_name || 'XJTUYou-unsigned' }}"
          APP="build/ios/iphoneos/Runner.app"

          # ---------- 1) 完整版：含课表小组件 + App Group ----------
          # 用途：付费开发者账号签名、TrollStore 安装
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          echo "--- 完整版信息 ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/Runner.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName"  Payload/Runner.app/Info.plist || true
          codesign -d --entitlements - Payload/Runner.app 2>&1 || true
          zip -qr "${NAME}.ipa" Payload
          ls -la "${NAME}.ipa"

          # ---------- 2) 无小组件版：剥离 App Group ----------
          # 用途：免费 Apple ID 签名。免费证书拿不到 App Groups 能力，
          #       带着它会直接安装失败（profile 与 entitlements 不匹配）。
          # ⚠️ ipa 的顶层目录名必须恰好是 Payload，否则爱思助手等工具找不到 App。
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" Payload/
          rm -rf Payload/Runner.app/PlugIns
          cat > /tmp/nogroup.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict/>
          </plist>
          PLIST
          codesign -f -s - --entitlements /tmp/nogroup.entitlements Payload/Runner.app
          echo "--- 无小组件版 entitlements ---"
          codesign -d --entitlements - Payload/Runner.app 2>&1 || true
          zip -qr "${NAME}-nogroup.ipa" Payload
          ls -la "${NAME}-nogroup.ipa"
          echo "--- 顶层目录必须只有 Payload ---"
          unzip -l "${NAME}-nogroup.ipa" | head -5

          echo "IPA_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_name || 'XJTUYou-unsigned' }}
          path: |
            ${{ env.IPA_NAME }}.ipa
            ${{ env.IPA_NAME }}-nogroup.ipa
          retention-days: 30
